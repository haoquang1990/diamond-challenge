#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions: []

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: app_writes_household_tables
    status: active
    description: "The app must never write households, household_members or household_codes directly; only RPCs and Edge Functions."
    why: "Membership limits, code uniqueness and cycle checks live in server functions."
    adr: docs/architecture/adr-0001-household-model.md
    added: 2026-11-07
  - pattern: push_contacts_without_consent
    status: active
    description: "The app must never push contact events before the user consented."
    why: "Decision C: contacts go to the server only after consent."
    adr: docs/architecture/adr-0002-household-contacts-on-server.md
    added: 2026-11-07
  - pattern: update_or_delete_contact_events_from_app
    status: active
    description: "Contact events are append-only for clients; edits are new events, undo is a compensating event."
    why: "Concurrent edits merge by event id; only code-merge RPCs change household_id."
    adr: docs/architecture/adr-0002-household-contacts-on-server.md
    added: 2026-11-07
  - pattern: service_role_key_in_app
    status: active
    description: "No secret or service_role key in src, dist, .env.production or the repository."
    why: "The publishable key is public; RLS is the only guard."
    adr: docs/architecture/adr-0001-household-model.md
    added: 2026-11-07

